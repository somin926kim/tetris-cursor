<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테트리스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">TETRIS</h1>
      <p class="app-subtitle">클래식 블록 퍼즐</p>
    </header>

    <main class="game-layout">
      <section class="board-card" aria-label="게임 보드">
        <div class="board-frame">
          <canvas id="game-board" width="300" height="600"></canvas>
          <div id="game-over-overlay" class="game-over-overlay hidden" aria-hidden="true">
            <p class="game-over-text">게임 오버</p>
            <button id="restart-btn" class="restart-btn" type="button">다시 시작</button>
          </div>
        </div>
      </section>

      <aside class="sidebar" aria-label="게임 정보">
        <div class="stat-card">
          <span class="stat-label">점수</span>
          <span class="stat-value" id="score">0</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">레벨</span>
          <span class="stat-value" id="level">1</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">라인</span>
          <span class="stat-value" id="lines">0</span>
        </div>

        <div class="panel next-panel">
          <span class="panel-label">다음 블록</span>
          <div class="next-frame">
            <canvas id="next-piece" width="120" height="120"></canvas>
          </div>
        </div>

        <div class="panel controls-panel">
          <span class="panel-label">조작법</span>
          <ul class="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
            <li><kbd>↑</kbd> 회전</li>
            <li><kbd>↓</kbd> 소프트 드롭</li>
            <li><kbd>Space</kbd> 하드 드롭</li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
